services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: playnext
      POSTGRES_PASSWORD: playnext
      POSTGRES_DB: playnext
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - playnext_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playnext -d playnext"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Override host so the bot reaches Postgres over the compose network.
      DATABASE_URL: postgresql+asyncpg://playnext:playnext@db:5432/playnext
    restart: unless-stopped
    # Run migrations, then start the bot.
    command: sh -c "alembic upgrade head && python -m playnext"

volumes:
  playnext_pgdata:
