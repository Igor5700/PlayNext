[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playnext"
version = "1.0.0"
description = "PlayNext — a digital-goods store that feels like a native app inside Telegram."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Igor" }]
dependencies = [
    "aiogram>=3.29",
    "SQLAlchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "sentry-sdk>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
playnext = "playnext.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
playnext = ["py.typed", "assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # allow Cyrillic in strings/comments
    "UP046", "UP047",               # keep explicit TypeVar/Generic[T] (clearer, wider tooling support than PEP 695)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/seed.py" = ["E501"]  # long lines are demo-catalog data tuples

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
namespace_packages = true
ignore_missing_imports = true
